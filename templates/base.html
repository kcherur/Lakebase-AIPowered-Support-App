<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support Tickets{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --border: #e2e5ea;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --open: #2563eb;
      --in_progress: #d97706;
      --resolved: #16a34a;
      --closed: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    header a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 18px;
    }
    main {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input[type=text], textarea, select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 14px;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .ticket-list { list-style: none; margin: 0; padding: 0; }
    .ticket-list li {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #fff;
    }
    .ticket-list a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
    }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      text-transform: capitalize;
    }
    .badge.open { background: var(--open); }
    .badge.in_progress { background: var(--in_progress); }
    .badge.resolved { background: var(--resolved); }
    .badge.closed { background: var(--closed); }
    .message {
      border-left: 3px solid var(--accent);
      padding: 8px 14px;
      margin-bottom: 10px;
      background: #fafafe;
      border-radius: 0 6px 6px 0;
    }
    .message .meta { margin-top: 2px; margin-bottom: 0; }
    .empty { color: var(--muted); font-size: 14px; }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .filters { margin-bottom: 16px; }
    .filters a {
      margin-right: 10px;
      text-decoration: none;
      font-size: 13px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .filters a.active { background: var(--accent); color: #fff; }
    .inline-form { display: flex; gap: 8px; align-items: center; }
    .inline-form select { margin-bottom: 0; width: auto; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('list_tickets') }}">🎫 Support Tickets</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
